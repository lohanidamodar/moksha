name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # engines says node >=20.12, so both ends of that are worth proving.
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The five bundled families need no network; this is for the handful of
      # tests that reach for one that is not bundled.
      - name: Cache fonts
        uses: actions/cache@v4
        with:
          path: ~/.cache/moksha/fonts
          key: moksha-fonts-${{ hashFiles('src/core/fonts.js') }}

      - run: npm ci

      - run: npm test

      # The studio ships inside the package and `moksha studio` serves it, so a
      # build failure is a release failure.
      - run: npm run build

      # Drives the CLI the way a person does, in a throwaway app repo: init,
      # render both locales, and check that the failures actually fail —
      # a boxed font, a broken project, capture with no device.
      - run: node scripts/e2e.mjs

  offline:
    # The claim is that a fresh clone renders its own defaults, and Nepali,
    # with no network. This is the only place that is actually true or not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render with an empty font cache and fetch disabled
        env:
          MOKSHA_FONT_CACHE: /tmp/definitely-empty
        # --import makes fetch throw, so this proves the claim rather than
        # relying on proxy variables node's fetch ignores anyway.
        run: >-
          node --import ./scripts/no-network.mjs --test
          "src/core/node/render.test.js" "src/core/node/glyphs.test.js"
